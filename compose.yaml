x-backend: &backend
  image: lifearchive-server:m0
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-life_archive}
    POSTGRES_DB: ${POSTGRES_DB:-life_archive}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
    LIFEARCHIVE_LOG_LEVEL: ${LIFEARCHIVE_LOG_LEVEL:-INFO}
    LIFEARCHIVE_COOKIE_SECURE: ${LIFEARCHIVE_COOKIE_SECURE:-true}
    LIFEARCHIVE_TRUSTED_ORIGINS: '${LIFEARCHIVE_TRUSTED_ORIGINS:-["http://127.0.0.1:8080","http://127.0.0.1:5173"]}'
  init: true
  security_opt:
    - no-new-privileges:true

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    <<: *backend
    command: ["uvicorn", "life_archive.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    profiles: ["worker"]
    command: ["python", "-m", "life_archive.worker"]
    networks:
      - database
    restart: "no"

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-life_archive}
      POSTGRES_DB: ${POSTGRES_DB:-life_archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  frontend:
  database:
    internal: true

volumes:
  pgdata:
