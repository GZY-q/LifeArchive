[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "life-archive-server"
version = "0.1.0"
description = "LifeArchive modular API and independent worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.161.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.0.55",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/life_archive"]

[tool.uv]
required-version = "==0.12.17"

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
